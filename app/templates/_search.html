<section class="panel search-box">
  <h2>Buscar nas milhas já coletadas</h2>
  <form method="get" action="/buscar" class="search-form" id="search-form">
    <label>
      Origem
      <select name="origem">
        {% for code in origins %}
        <option value="{{ code }}" {% if (filters.origin if filters is defined and filters.origin else active_origin) == code %}selected{% endif %}>
          {{ code }} · {{ origin_labels.get(code, code) }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>
      Destino
      <input name="destino" list="destinos" placeholder="SSA, Lisboa, VIX…" value="{{ filters.destination if filters is defined else '' }}">
      <datalist id="destinos">
        {% for code, city in airport_options %}
        <option value="{{ code }}">{{ city }}</option>
        {% endfor %}
      </datalist>
    </label>
    <label>
      Tipo
      <select name="tipo" id="trip_type">
        <option value="one_way" {% if not filters is defined or filters.trip_type != 'round_trip' %}selected{% endif %}>Só ida</option>
        <option value="round_trip" {% if filters is defined and filters.trip_type == 'round_trip' %}selected{% endif %}>Ida e volta</option>
      </select>
    </label>
    <label>
      Cabine
      <select name="cabin">
        <option value="all" {% if not filters is defined or filters.cabin == 'all' %}selected{% endif %}>Todas</option>
        <option value="economy" {% if filters is defined and filters.cabin == 'economy' %}selected{% endif %}>Econômica</option>
        <option value="premium" {% if filters is defined and filters.cabin == 'premium' %}selected{% endif %}>Premium</option>
        <option value="business" {% if filters is defined and filters.cabin == 'business' %}selected{% endif %}>Executiva</option>
      </select>
    </label>
    <label>
      Data de ida
      <input type="date" name="ida" value="{{ filters.date_from if filters is defined else '' }}">
    </label>
    <label id="return-date-wrap">
      Data de volta
      <input type="date" name="volta" value="{{ filters.date_to if filters is defined else '' }}">
    </label>
    <label>
      Programa
      <select name="cia">
        <option value="">Todas as cias</option>
        <option value="latam" {% if filters is defined and filters.program == 'latam' %}selected{% endif %}>LATAM Pass</option>
        <option value="azul" {% if filters is defined and filters.program == 'azul' %}selected{% endif %}>TudoAzul</option>
        <option value="smiles" {% if filters is defined and filters.program == 'smiles' %}selected{% endif %}>Smiles (GOL)</option>
      </select>
    </label>
    <label>
      Companhia (texto)
      <input name="companhia" placeholder="LATAM, Azul…" value="{{ filters.airline if filters is defined else '' }}">
    </label>
    <button type="submit">Mostrar menores valores</button>
  </form>
  <p class="hint">
    A busca só filtra o que já foi coletado. Só ida mostra o menor trecho saindo da origem.
    Ida e volta soma o menor voo de ida com o menor voo de volta do mesmo destino, para a origem escolhida.
  </p>
</section>
